
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício CRUD Lista</title>
</head>
<body>

    <h1>Exercício CRUD Lista</h1>
    <p>Utilize o menu para realizar as operações.</p>

    <script>
        function criarNo(dado) {
            return {
                dado: dado,
                proximo: null
            };
        }

        function criarLista() {
            return {
                inicio: null
            };
        }

        function lerDado(mensagem) {
            let dado = prompt(mensagem);

            if (dado === null || dado === "") {
                alert("Operação cancelada ou dado vazio.");
                return null;
            }

            return dado;
        }

        function lerPosicao(mensagem) {
            let entrada = prompt(mensagem);

            if (entrada === null) {
                return null;
            }

            let posicao = Number(entrada);

            if (entrada === "" ||
                !Number.isInteger(posicao) ||
                posicao < 0) {

                alert("Digite uma posição válida.");
                return null;
            }

            return posicao;
        }

        function listarTodos(lista) {
            if (lista.inicio === null) {
                alert("A lista está vazia.");
                return;
            }

            let atual = lista.inicio;
            let resultado = "";
            let posicao = 0;

            while (atual !== null) {
                resultado += "[" + posicao + "] " +
                             atual.dado + "\n";

                atual = atual.proximo;
                posicao++;
            }

            alert(resultado);
        }

        function inserirNoFim(lista, dado) {
            let novoNo = criarNo(dado);

            if (lista.inicio === null) {
                lista.inicio = novoNo;
                return;
            }

            let atual = lista.inicio;

            while (atual.proximo !== null) {
                atual = atual.proximo;
            }

            atual.proximo = novoNo;
        }

        function inserirNaPosicao(lista, dado, posicao) {
            let novoNo = criarNo(dado);

            if (posicao === 0) {
                novoNo.proximo = lista.inicio;
                lista.inicio = novoNo;
                return true;
            }

            let atual = lista.inicio;
            let indice = 0;

            while (atual !== null && indice < posicao - 1) {
                atual = atual.proximo;
                indice++;
            }

            if (atual === null) {
                alert("Posição inválida.");
                return false;
            }

            novoNo.proximo = atual.proximo;
            atual.proximo = novoNo;

            return true;
        }

        function menu(lista) {
            let opcao;

            while (true) {
                opcao = prompt(
                    "CRUD - LISTA LIGADA\n\n" +
                    "[1] Listar todos\n" +
                    "[2] Inserir no fim\n" +
                    "[3] Inserir na posição\n" +
                    "[4] Sair\n\n" +
                    "Digite uma opção:"
                );

                if (opcao === null) {
                    alert("Programa encerrado.");
                    break;
                }

                switch (opcao) {
                    case "1":
                        listarTodos(lista);
                        break;

                    case "2":
                        let dadoFim = lerDado(
                            "Digite o elemento:"
                        );

                        if (dadoFim !== null) {
                            inserirNoFim(lista, dadoFim);
                            alert("Elemento inserido no final.");
                        }
                        break;

                    case "3":
                        let dadoPosicao = lerDado(
                            "Digite o elemento:"
                        );

                        if (dadoPosicao === null) {
                            break;
                        }

                        let posicao = lerPosicao(
                            "Digite a posição desejada (começando em 0):"
                        );

                        if (posicao !== null) {
                            if (inserirNaPosicao(
                                lista, dadoPosicao, posicao
                            )) {
                                alert("Elemento inserido com sucesso.");
                            }
                        }
                        break;

                    case "4":
                        alert("Programa encerrado.");
                        return;

                    default:
                        alert("Opção inválida. Escolha de 1 a 4.");
                }
            }
        }

        let lista = criarLista();
        menu(lista);

    </script>

</body>
</html>
